<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>化学変化とイオン 暗記ドリル</title>
<style>
  :root{
    --ink:#0A1020;
    --surface:#141E33;
    --surface-hi:#1C2A45;
    --line:#26344F;
    --plus:#FF3D71;
    --minus:#2FD3E8;
    --paper:#EAF0FA;
    --muted:#7A8CA8;
    --ok:#4ADE9B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
    font-size:16px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding:0 20px calc(40px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:560px;margin:0 auto}

  /* ---------- hero ---------- */
  .hero{padding:44px 0 30px;border-bottom:1px solid var(--line)}
  .equation{
    font-size:clamp(30px,9vw,46px);
    font-weight:600;
    letter-spacing:.02em;
    line-height:1.25;
    margin:0 0 14px;
  }
  .equation .p{color:var(--plus)}
  .equation .m{color:var(--minus)}
  .equation sub{font-size:.55em;vertical-align:-.15em}
  .equation sup{font-size:.55em;vertical-align:.45em}
  .hero p{margin:0;color:var(--muted);font-size:14.5px;max-width:44ch}

  /* ---------- progress ---------- */
  .meter{margin:26px 0 8px}
  .meter-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
  .meter-count{font-size:26px;font-weight:600;letter-spacing:.01em}
  .meter-count span{font-size:15px;color:var(--muted);font-weight:400}
  .meter-note{font-size:13px;color:var(--muted)}
  .bar{height:7px;background:var(--surface);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--minus);border-radius:99px;transition:width .45s cubic-bezier(.2,.7,.3,1)}

  /* ---------- section list ---------- */
  .list{margin:30px 0 0;padding:0;list-style:none}
  .row{
    display:flex;gap:15px;align-items:flex-start;
    width:100%;text-align:left;
    background:none;border:0;border-top:1px solid var(--line);
    color:inherit;font:inherit;
    padding:17px 2px;cursor:pointer;
  }
  .list li:last-child .row{border-bottom:1px solid var(--line)}
  .row:hover{background:rgba(255,255,255,.028)}
  .row:focus-visible{outline:2px solid var(--minus);outline-offset:-2px}
  .slot{
    flex:0 0 auto;width:62px;
    font-size:12.5px;color:var(--muted);
    padding-top:4px;font-variant-numeric:tabular-nums;
  }
  .row-main{flex:1 1 auto;min-width:0}
  .row-title{font-size:16.5px;font-weight:600;margin-bottom:3px}
  .row-sub{font-size:13px;color:var(--muted)}
  .tally{
    flex:0 0 auto;align-self:center;
    font-size:13.5px;color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .tally.full{color:var(--ok)}

  .weak{
    margin-top:28px;width:100%;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    color:var(--paper);font:inherit;font-size:15px;
    padding:15px;cursor:pointer;text-align:left;
  }
  .weak:disabled{opacity:.4;cursor:default}
  .weak b{font-weight:600}
  .weak span{color:var(--muted);font-size:13px;display:block;margin-top:2px}

  /* ---------- card view ---------- */
  .bar-top{display:flex;align-items:center;gap:14px;padding:22px 0 20px}
  .back{
    background:none;border:0;color:var(--muted);font:inherit;font-size:14px;
    padding:6px 0;cursor:pointer;flex:0 0 auto;
  }
  .back:hover{color:var(--paper)}
  .queue{flex:1 1 auto;text-align:right;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:30px 24px;
    min-height:210px;
    display:flex;flex-direction:column;justify-content:center;
  }
  .q{font-size:19px;font-weight:600;line-height:1.65;margin:0}
  .q .hint{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:9px}

  .a{
    max-height:0;opacity:0;overflow:hidden;
    transition:max-height .35s cubic-bezier(.2,.7,.3,1),opacity .3s ease,margin .35s ease;
  }
  .a.show{max-height:520px;opacity:1;margin-top:22px}
  .a-inner{border-top:1px solid var(--line);padding-top:20px}
  .ans{
    font-size:clamp(23px,6.4vw,30px);
    font-weight:600;letter-spacing:.015em;line-height:1.45;
    word-break:break-word;
  }
  .ans sub{font-size:.6em;vertical-align:-.15em}
  .ans sup{font-size:.6em;vertical-align:.42em}
  .ans .p{color:var(--plus)}
  .ans .m{color:var(--minus)}
  .note{font-size:14px;color:var(--muted);margin-top:14px;line-height:1.7}

  .actions{display:flex;gap:11px;margin-top:20px}
  .btn{
    flex:1 1 0;border-radius:12px;border:1px solid var(--line);
    background:var(--surface-hi);color:var(--paper);
    font:inherit;font-size:16px;font-weight:600;
    padding:16px 10px;cursor:pointer;
  }
  .btn:hover{background:#233355}
  .btn:focus-visible{outline:2px solid var(--minus);outline-offset:2px}
  .btn-reveal{background:var(--paper);color:var(--ink);border-color:var(--paper)}
  .btn-ok{border-color:rgba(74,222,155,.5);color:var(--ok)}
  .btn-again{color:var(--muted)}

  .done-panel{padding:60px 0;text-align:center}
  .done-panel h2{font-size:22px;margin:0 0 10px;font-weight:600}
  .done-panel p{color:var(--muted);font-size:15px;margin:0 0 26px}

  .hidden{display:none}
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- HOME -->
  <div id="home">
    <div class="hero">
      <div class="equation">
        H<sup class="p">+</sup> + OH<sup class="m">−</sup> → H<sub>2</sub>O
      </div>
      <p>この単元は、＋と−が釣り合うかどうかで全部決まります。66問。順番どおりに進めれば、65点の土台ができます。</p>
    </div>

    <div class="meter">
      <div class="meter-top">
        <div class="meter-count"><b id="doneN">0</b><span> / 66問できた</span></div>
        <div class="meter-note" id="meterNote">上から順に</div>
      </div>
      <div class="bar"><i id="barFill"></i></div>
    </div>

    <ul class="list" id="sectionList"></ul>

    <button class="weak" id="weakBtn" disabled>
      <b>まちがえた問題だけ復習</b>
      <span id="weakNote">「もう一度」を押した問題がここに集まります</span>
    </button>
  </div>

  <!-- SESSION -->
  <div id="session" class="hidden">
    <div class="bar-top">
      <button class="back" id="backBtn">← 一覧</button>
      <div class="queue" id="queueInfo"></div>
    </div>

    <div id="cardArea">
      <div class="card">
        <p class="q" id="qText"></p>
        <div class="a" id="aBox">
          <div class="a-inner">
            <div class="ans" id="aText"></div>
            <div class="note" id="aNote"></div>
          </div>
        </div>
      </div>
      <div class="actions" id="actions"></div>
    </div>

    <div id="donePanel" class="done-panel hidden">
      <h2 id="doneTitle"></h2>
      <p id="doneMsg"></p>
      <button class="btn btn-reveal" id="doneBack" style="max-width:220px;margin:0 auto">一覧にもどる</button>
    </div>
  </div>

</div>

<script>
const P = s => '<span class="p">'+s+'</span>';
const M = s => '<span class="m">'+s+'</span>';

const SECTIONS = [
  {
    id:'ion', slot:'0–15分', title:'イオンの化学式', sub:'すべての土台。ここが穴だと後が崩れる',
    items:[
      {q:'水素イオン', a:'H'+P('<sup>+</sup>')},
      {q:'ナトリウムイオン', a:'Na'+P('<sup>+</sup>')},
      {q:'カリウムイオン', a:'K'+P('<sup>+</sup>')},
      {q:'アンモニウムイオン', a:'NH<sub>4</sub>'+P('<sup>+</sup>')},
      {q:'銅イオン', a:'Cu'+P('<sup>2+</sup>')},
      {q:'亜鉛イオン', a:'Zn'+P('<sup>2+</sup>')},
      {q:'マグネシウムイオン', a:'Mg'+P('<sup>2+</sup>')},
      {q:'カルシウムイオン', a:'Ca'+P('<sup>2+</sup>')},
      {q:'バリウムイオン', a:'Ba'+P('<sup>2+</sup>')},
      {q:'塩化物イオン', a:'Cl'+M('<sup>−</sup>'), n:'「塩素イオン」ではなく塩化物イオン'},
      {q:'水酸化物イオン', a:'OH'+M('<sup>−</sup>'), n:'OとHの順番に注意'},
      {q:'硝酸イオン', a:'NO<sub>3</sub>'+M('<sup>−</sup>')},
      {q:'硫酸イオン', a:'SO<sub>4</sub>'+M('<sup>2−</sup>'), n:'−が2つなのはこれだけ'}
    ]
  },
  {
    id:'denri', slot:'15–30分', title:'電離を表す式', sub:'右辺の＋と−を同じ数にそろえる',
    items:[
      {q:'塩化水素（塩酸）の電離', a:'HCl → H'+P('<sup>+</sup>')+' + Cl'+M('<sup>−</sup>')},
      {q:'塩化ナトリウムの電離', a:'NaCl → Na'+P('<sup>+</sup>')+' + Cl'+M('<sup>−</sup>')},
      {q:'水酸化ナトリウムの電離', a:'NaOH → Na'+P('<sup>+</sup>')+' + OH'+M('<sup>−</sup>')},
      {q:'硫酸の電離', a:'H<sub>2</sub>SO<sub>4</sub> → 2H'+P('<sup>+</sup>')+' + SO<sub>4</sub>'+M('<sup>2−</sup>'), n:'SO₄の−2に合わせてH⁺が2個'},
      {q:'塩化銅の電離', a:'CuCl<sub>2</sub> → Cu'+P('<sup>2+</sup>')+' + 2Cl'+M('<sup>−</sup>'), n:'Cu²⁺の＋2に合わせてCl⁻が2個'},
      {q:'水酸化バリウムの電離', a:'Ba(OH)<sub>2</sub> → Ba'+P('<sup>2+</sup>')+' + 2OH'+M('<sup>−</sup>'), n:'カッコの外の2はOH全体にかかる'}
    ]
  },
  {
    id:'chuwa', slot:'30–50分', title:'中和の化学反応式', sub:'酸＋アルカリ→塩＋水。5本を型で覚える',
    items:[
      {q:'塩酸 ＋ 水酸化ナトリウム', a:'HCl + NaOH → NaCl + H<sub>2</sub>O', n:'できる塩は塩化ナトリウム。これは絶対に落とせない'},
      {q:'硫酸 ＋ 水酸化バリウム', a:'H<sub>2</sub>SO<sub>4</sub> + Ba(OH)<sub>2</sub> → BaSO<sub>4</sub> + 2H<sub>2</sub>O', n:'硫酸バリウムは水にとけず白い沈殿。イオンが減るので電流が流れにくくなる'},
      {q:'硫酸 ＋ 水酸化ナトリウム', a:'H<sub>2</sub>SO<sub>4</sub> + 2NaOH → Na<sub>2</sub>SO<sub>4</sub> + 2H<sub>2</sub>O', n:'SO₄の−2にNa⁺が2個必要 → NaOHも2個 → 水も2個'},
      {q:'塩酸 ＋ 水酸化カルシウム', a:'2HCl + Ca(OH)<sub>2</sub> → CaCl<sub>2</sub> + 2H<sub>2</sub>O', n:'Ca²⁺の＋2にCl⁻が2個必要'},
      {q:'硝酸 ＋ 水酸化ナトリウム', a:'HNO<sub>3</sub> + NaOH → NaNO<sub>3</sub> + H<sub>2</sub>O'}
    ]
  },
  {
    id:'yougo', slot:'50–65分', title:'用語25問', sub:'先生が配ったプリントそのまま。配点効率が最も高い',
    items:[
      {q:'塩化ナトリウムや塩化水素のように、水にとけると水溶液に電流が流れる物質を何というか。', a:'電解質'},
      {q:'砂糖やエタノールのように、水にとけても水溶液に電流が流れない物質を何というか。', a:'非電解質'},
      {q:'同じ元素で、中性子の数が異なる原子を何というか。', a:'同位体'},
      {q:'原子が電気を帯びたものを何というか。', a:'イオン'},
      {q:'イオンのうち、＋の電気を帯びたものを何というか。', a:'陽イオン'},
      {q:'イオンのうち、−の電気を帯びたものを何というか。', a:'陰イオン'},
      {q:'電解質が水にとけて、陽イオンと陰イオンに分かれることを何というか。', a:'電離'},
      {q:'化学エネルギーを電気エネルギーに変換してとり出す装置を何というか。', a:'電池（化学電池）'},
      {q:'充電できない電池を何というか。', a:'一次電池'},
      {q:'充電できる電池を何というか。', a:'二次電池（蓄電池）'},
      {q:'水の電気分解と逆の化学変化を利用して、電気エネルギーをとり出すしくみを何というか。', a:'燃料電池'},
      {q:'水溶液中で電離して、水素イオンを生じる物質を何というか。', a:'酸'},
      {q:'水溶液中で電離して、水酸化物イオンを生じる物質を何というか。', a:'アルカリ'},
      {q:'水溶液の性質によって色が変わる薬品を何というか。', a:'指示薬'},
      {q:'酸性・アルカリ性の強さを表す数値を何というか。', a:'pH'},
      {q:'pHの値が7の水溶液の性質は何か。', a:'中性'},
      {q:'BTB溶液は、酸性で何色になるか。', a:'黄色'},
      {q:'フェノールフタレイン溶液は、アルカリ性で何色になるか。', a:'赤色'},
      {q:'酸の水溶液とアルカリの水溶液を混ぜたときに起こる、たがいの性質を打ち消し合う反応を何というか。', a:'中和'},
      {q:'アルカリの陽イオンと酸の陰イオンが結びついてできる物質を何というか。', a:'塩（えん）', n:'食塩のことではない。読み方も答えられるように'},
      {q:'うすい塩酸とうすい水酸化ナトリウム水溶液の中和では、何という塩ができるか。', a:'塩化ナトリウム'},
      {q:'ナトリウムイオンを化学式で書きなさい。', a:'Na'+P('<sup>+</sup>')},
      {q:'水酸化物イオンを化学式で書きなさい。', a:'OH'+M('<sup>−</sup>')},
      {q:'水酸化ナトリウムの電離を表す式を書きなさい。', a:'NaOH → Na'+P('<sup>+</sup>')+' + OH'+M('<sup>−</sup>')},
      {q:'うすい塩酸とうすい水酸化ナトリウム水溶液の中和を化学反応式で表しなさい。', a:'HCl + NaOH → NaCl + H<sub>2</sub>O'}
    ]
  },
  {
    id:'shiji', slot:'65–72分', title:'指示薬と色', sub:'暗記だけで取れる。落とすともったいない',
    items:[
      {q:'BTB溶液　酸性・中性・アルカリ性の色は', a:'黄　→　緑　→　青'},
      {q:'フェノールフタレイン溶液の色は', a:'酸性・中性は無色／アルカリ性は赤'},
      {q:'青色リトマス紙はどんなときに変化するか', a:'酸性で赤に変わる'},
      {q:'赤色リトマス紙はどんなときに変化するか', a:'アルカリ性で青に変わる'},
      {q:'マグネシウムリボンを入れるとどうなるか', a:'酸性なら水素が発生する'},
      {q:'酸性の正体は何イオンか', a:'水素イオン H'+P('<sup>+</sup>')},
      {q:'アルカリ性の正体は何イオンか', a:'水酸化物イオン OH'+M('<sup>−</sup>')}
    ]
  },
  {
    id:'denchi', slot:'72–85分', title:'電池と電気分解', sub:'記述で出るならここ。文で言えるように',
    items:[
      {q:'ダニエル電池の−極は何板か。そこで起こる変化を式で。', a:'亜鉛板　Zn → Zn'+P('<sup>2+</sup>')+' + 2e'+M('<sup>−</sup>'), n:'亜鉛板は溶けて細くなる'},
      {q:'ダニエル電池の＋極は何板か。そこで起こる変化を式で。', a:'銅板　Cu'+P('<sup>2+</sup>')+' + 2e'+M('<sup>−</sup>')+' → Cu', n:'銅が付着して太くなる'},
      {q:'ダニエル電池で電子はどちら向きに流れるか。', a:'亜鉛板 → 導線 → 銅板', n:'電流の向きはこの逆'},
      {q:'ダニエル電池のセロハンの役割を書きなさい。', a:'2つの水溶液がすぐに混ざるのを防ぎ、イオンを通して電気のかたよりをなくすため。', n:'記述の最有力。文ごと覚える'},
      {q:'電池になるための条件は。', a:'2種類のちがう金属を、電解質の水溶液に入れる。'},
      {q:'マグネシウム・亜鉛・銅を、イオンになりやすい順に。', a:'マグネシウム ＞ 亜鉛 ＞ 銅'},
      {q:'塩化銅水溶液の電気分解を化学反応式で。', a:'CuCl<sub>2</sub> → Cu + Cl<sub>2</sub>'},
      {q:'塩化銅水溶液の電気分解で、陰極と陽極で何が起こるか。', a:'陰極に赤色の銅が付着／陽極から塩素が発生', n:'塩素は刺激臭・プールの消毒のにおい・漂白作用'},
      {q:'陽極で発生した気体が予想より少ないのはなぜか。', a:'塩素は水にとけやすいから。', n:'記述で頻出'},
      {q:'燃料電池で起こる反応を化学反応式で。', a:'2H<sub>2</sub> + O<sub>2</sub> → 2H<sub>2</sub>O', n:'水しかできないので環境への影響が少ない'}
    ]
  }
];

/* ---- build flat index ---- */
const ALL = [];
SECTIONS.forEach(s => s.items.forEach((it,i)=>{
  it.id = s.id+'-'+i; it.sec = s.id; ALL.push(it);
}));
const TOTAL = ALL.length;

const state = { done:new Set(), missed:new Set() };
let queue = [], current = null, revealed = false, sessionLabel = '', sessionCount = 0;

const $ = id => document.getElementById(id);

/* ---------- home ---------- */
function renderHome(){
  $('home').classList.remove('hidden');
  $('session').classList.add('hidden');

  $('doneN').textContent = state.done.size;
  $('barFill').style.width = (state.done.size/TOTAL*100)+'%';
  $('meterNote').textContent = state.done.size===TOTAL ? '全部おわった' : '上から順に';

  $('sectionList').innerHTML = SECTIONS.map(s=>{
    const d = s.items.filter(it=>state.done.has(it.id)).length;
    const full = d===s.items.length;
    return `<li><button class="row" data-sec="${s.id}">
      <span class="slot">${s.slot}</span>
      <span class="row-main">
        <span class="row-title">${s.title}</span>
        <span class="row-sub">${s.sub}</span>
      </span>
      <span class="tally${full?' full':''}">${d}/${s.items.length}</span>
    </button></li>`;
  }).join('');

  document.querySelectorAll('.row').forEach(b=>{
    b.addEventListener('click',()=>startSection(b.dataset.sec));
  });

  const weak = ALL.filter(it=>state.missed.has(it.id));
  const wb = $('weakBtn');
  wb.disabled = weak.length===0;
  $('weakNote').textContent = weak.length===0
    ? '「もう一度」を押した問題がここに集まります'
    : weak.length+'問たまっています';
}

/* ---------- session ---------- */
function startSection(id){
  const s = SECTIONS.find(x=>x.id===id);
  queue = s.items.filter(it=>!state.done.has(it.id)).slice();
  if(queue.length===0) queue = s.items.slice();
  sessionLabel = s.title;
  beginSession();
}
function startWeak(){
  queue = ALL.filter(it=>state.missed.has(it.id));
  sessionLabel = 'まちがえた問題';
  beginSession();
}
function beginSession(){
  sessionCount = queue.length;
  $('home').classList.add('hidden');
  $('session').classList.remove('hidden');
  $('donePanel').classList.add('hidden');
  $('cardArea').classList.remove('hidden');
  next();
}

function next(){
  if(queue.length===0){ finish(); return; }
  current = queue[0];
  revealed = false;
  $('qText').innerHTML = current.q;
  $('aText').innerHTML = current.a;
  $('aNote').innerHTML = current.n || '';
  $('aNote').style.display = current.n ? 'block' : 'none';
  $('aBox').classList.remove('show');
  $('queueInfo').textContent = sessionLabel+'　のこり '+queue.length+'問';
  $('actions').innerHTML = '<button class="btn btn-reveal" id="revealBtn">答えを見る</button>';
  $('revealBtn').addEventListener('click', reveal);
  $('revealBtn').focus();
}

function reveal(){
  revealed = true;
  $('aBox').classList.add('show');
  $('actions').innerHTML =
    '<button class="btn btn-again" id="againBtn">もう一度</button>'+
    '<button class="btn btn-ok" id="okBtn">できた</button>';
  $('againBtn').addEventListener('click', ()=>grade(false));
  $('okBtn').addEventListener('click', ()=>grade(true));
  $('okBtn').focus();
}

function grade(ok){
  const it = queue.shift();
  if(ok){
    state.done.add(it.id);
    state.missed.delete(it.id);
  }else{
    state.done.delete(it.id);
    state.missed.add(it.id);
    queue.push(it);
  }
  next();
}

function finish(){
  $('cardArea').classList.add('hidden');
  $('donePanel').classList.remove('hidden');
  $('queueInfo').textContent = '';
  $('doneTitle').textContent = sessionLabel+'　クリア';
  const left = TOTAL - state.done.size;
  $('doneMsg').textContent = left===0
    ? '66問すべて言えるようになりました。あとは紙に手で書いて確かめるだけ。'
    : 'のこり'+left+'問。次のまとまりへ。';
}

/* ---------- events ---------- */
$('backBtn').addEventListener('click', renderHome);
$('doneBack').addEventListener('click', renderHome);
$('weakBtn').addEventListener('click', startWeak);

document.addEventListener('keydown', e=>{
  if($('session').classList.contains('hidden')) return;
  if($('cardArea').classList.contains('hidden')) return;
  if(e.key===' '||e.key==='Enter'){
    if(!revealed){ e.preventDefault(); reveal(); }
  }else if(revealed && (e.key==='1')){ grade(false); }
  else if(revealed && (e.key==='2')){ grade(true); }
});

renderHome();
</script>
</body>
</html>
